services:
  - type: web
    name: herta-license-service
    runtime: node
    rootDir: platform/license-service
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: ADMIN_TOKEN
        sync: false
      - key: LICENSE_STORE
        value: /tmp/licenses.json
