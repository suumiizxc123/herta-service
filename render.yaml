services:
  - type: web
    name: herta-license-service
    runtime: node
    rootDir: platform/license-service
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    plan: 0.5c-512mb
    healthCheckPath: /health
    disk:
      name: herta-license-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: ADMIN_TOKEN
        sync: false
